<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Shabda ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8f1fb; --bg2:#fbe8f0; --ink:#2f3a4f; --soft:#7d8aa3; --accent:#e08aa9; --blue:#8fb4e3;
  --paper:#fffdff; --env:#f6e8f0; --env2:#e4ddf0; --shadow:rgba(90,100,150,.18);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1a2236; --bg2:#2b1f31; --ink:#eef0f8; --soft:#a3aac2; --accent:#e58fae; --blue:#7fa3d6;
    --paper:#252b40; --env:#3a3550; --env2:#30304a; --shadow:rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:linear-gradient(160deg,var(--bg),var(--bg2)) fixed;color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,sans-serif;overflow:hidden;
  -webkit-tap-highlight-color:transparent}
.serif{font-family:'Fraunces',Georgia,'Times New Roman',serif}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));
  opacity:0;visibility:hidden;transition:opacity .9s ease,visibility .9s;text-align:center}
.screen.active{opacity:1;visibility:visible}

/* Screen 1 */
.hii{font-size:clamp(6rem,34vw,13rem);font-weight:700;line-height:1;letter-spacing:-.03em;font-style:italic}
.hii span{color:var(--accent)}
.sub{margin-top:14px;color:var(--soft);font-size:1rem}
.btn{margin-top:40px;border:0;border-radius:999px;padding:15px 38px;font:500 1rem 'Inter',sans-serif;
  background:var(--accent);color:#fff;cursor:pointer;transition:transform .2s,box-shadow .2s;
  box-shadow:0 8px 24px -8px var(--accent)}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.96)}

/* Envelope */
.stage{width:min(80vw,340px);aspect-ratio:3/2;position:relative;perspective:900px;cursor:pointer;
  animation:float 3.6s ease-in-out infinite;filter:drop-shadow(0 18px 24px var(--shadow))}
.stage.open{animation:none}
@keyframes float{50%{transform:translateY(-8px)}}
.env{position:absolute;inset:0;background:var(--env2);border-radius:6px}
.paper{position:absolute;left:8%;right:8%;top:6%;bottom:6%;background:var(--paper);border-radius:4px;
  z-index:1;transition:transform 1s cubic-bezier(.3,.7,.2,1) .5s;
  background-image:repeating-linear-gradient(transparent 0 14px,rgba(150,120,130,.14) 14px 15px);background-size:100% 100%;background-position:0 28px}
.front{position:absolute;inset:0;z-index:2;background:var(--env);border-radius:6px;
  clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%)}
.flap{position:absolute;left:0;right:0;top:0;height:56%;z-index:3;background:var(--env2);
  clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;
  transition:transform .8s ease,z-index 0s .35s;filter:brightness(.97)}
.stage.open .flap{transform:rotateX(180deg);z-index:0}
.stage.open .paper{transform:translateY(-52%)}
.seal{position:absolute;left:50%;top:54%;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;
  background:var(--accent);color:#fff;display:grid;place-items:center;z-index:4;font-size:18px;
  transition:opacity .4s}
.stage.open .seal{opacity:0}
.hint{margin-top:46px;color:var(--soft);font-size:.95rem;animation:pulse 2s ease-in-out infinite;transition:opacity .4s}
@keyframes pulse{50%{opacity:.35}}

/* Letter */
.card{width:min(92vw,640px);max-height:min(78dvh,760px);overflow-y:auto;text-align:left;
  background:var(--paper);border-radius:14px;padding:34px 30px;box-shadow:0 20px 50px -20px var(--shadow);
  scrollbar-width:none}
.card::-webkit-scrollbar{display:none}
.card p{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:1.06rem;line-height:1.85;margin-bottom:1.3em}
.card p:last-child{margin-bottom:0}
.w{opacity:0;animation:in .5s forwards}
@keyframes in{to{opacity:1}}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--accent);vertical-align:text-bottom;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.tap{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  padding:13px 30px;border-radius:999px;border:1px solid var(--accent);color:var(--accent);font-size:.95rem;
  background:var(--paper);opacity:0;visibility:hidden;transition:opacity .8s;animation:pulse 2s ease-in-out infinite;white-space:nowrap}
.tap.show{opacity:1;visibility:visible}
#s3.ready{cursor:pointer}

/* Finale */
.love{font-size:clamp(4.2rem,24vw,10rem);font-weight:700;line-height:.95;letter-spacing:-.03em;color:var(--accent);position:relative;z-index:2}
.row{font-size:clamp(1.6rem,7vw,2.6rem);margin:22px 0;position:relative;z-index:2;letter-spacing:.2em}
.heart{position:fixed;bottom:-50px;z-index:1;pointer-events:none;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-115dvh) rotate(25deg);opacity:0}}

.hii,.love{background:linear-gradient(135deg,var(--blue),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .12em .08em 0}
.btn{background:linear-gradient(135deg,var(--blue),var(--accent));box-shadow:0 10px 26px -12px var(--accent)}
.seal{background:linear-gradient(135deg,var(--blue),var(--accent))}
.caret{background:var(--accent)}
.mute{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:10;width:40px;height:40px;border-radius:50%;
  border:1px solid rgba(143,180,227,.5);background:var(--paper);color:var(--accent);font-size:17px;cursor:pointer;
  opacity:0;visibility:hidden;transition:opacity .6s}
.mute.show{opacity:1;visibility:visible}
</style>
</head>
<body>
<video id="bgm" loop preload="auto" playsinline webkit-playsinline src="/_blob/827833c7ee7bf4b13c147a6a03ec985f" style="position:fixed;width:2px;height:2px;opacity:0;pointer-events:none;left:0;top:0"></video>
<button class="mute" id="mute" aria-label="Toggle music">♪</button>

<section class="screen active" id="s1">
  <h1 class="hii serif">Hii</h1>
  <button class="btn" id="go">Continue</button>
</section>

<section class="screen" id="s2">
  <div class="stage" id="env">
    <div class="env"></div>
    <div class="paper"></div>
    <div class="front"></div>
    <div class="flap"></div>
    <div class="seal">♥</div>
  </div>
  <p class="hint" id="hint">tap the envelope</p>
</section>

<section class="screen" id="s3">
  <div class="card" id="card"></div>
  <div class="tap" id="tap">tap anywhere ♡</div>
</section>

<section class="screen" id="s4">
  <div class="row">💗 💕 💗</div>
  <h2 class="love serif">I LOVE<br>YOU</h2>
  <div class="row">❤️ 💕 ❤️</div>
</section>

<script>
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const letter=[
`Shabda, there’s so much about you that I genuinely love. I love how cute and funny you are, I love the way you are, and I don’t think you even realise how much happiness your little things bring me. I love it when you share the smallest details about yourself, when you tell me about your day, the random things that happen, or something that might seem unimportant to you. I love hearing all of it because it’s you, and anything that comes from you is something I genuinely want to listen to. I love how you talk to me with so much love and energy, how you treat me, and how you make even the simplest conversations feel special.`,
`And Shabda, I really would never want to be the reason you feel hurt. Sometimes I mess up with my reactions, especially when I laugh at something or send a laughing emoji without thinking about how it might make you feel. I promise my intention is never to make fun of you or make you feel bad about yourself. Sometimes I genuinely think you’ll laugh along or come back with an even funnier comeback, and I don’t realise that something I found funny might have hurt you. I’m sorry for those moments. I know that even a small reaction from me can change how you feel, and I should be more thoughtful about that.`,
`But you know what makes me sad sometimes? When we’re having such a lovely conversation, everything feels so nice, and suddenly it turns into a ‘nvm’ or a ‘huss’. I know you might just be expressing that something bothered you, but I get scared that I’ve somehow ruined the moment or made you feel differently. I don’t want our conversations to end with either of us feeling hurt, and I never want you to feel like you have to hide how you feel from me.`,
`I don’t want to lose you, Shabda. I don’t want to hurt you, not even a little, and I certainly don’t want you to ever question how much I love you because of a silly reaction or something I said without thinking. I’m not saying I’ll never make mistakes, but I genuinely want to understand you better and be more careful with your feelings. You deserve to feel loved, appreciated, and comfortable being yourself with me.`,
`I love you, Shabda. I love your funny side, your cute little habits, your endless talks, your energy, your stories, and even all those little things you probably don’t think twice about. I love you for being you, not for being perfect or always agreeing with me. And the last thing I would ever want is for the person who brings me so much happiness to feel sad because of me. I hope you always know that my heart is in the right place, even when my reactions don’t show it properly. ❤️`
];

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id))}

let opened=false, done=false;
const bgm=$('bgm'), mute=$('mute');
let on=true;
function fadeTo(v,ms){const a=bgm.volume,t0=performance.now();
  (function step(t){const k=Math.max(0,Math.min(1,(t-t0)/ms));bgm.volume=Math.max(0,Math.min(1,a+(v-a)*k));if(k<1)requestAnimationFrame(step)})(t0)}
$('go').onclick=()=>{
  show('s2');
  bgm.volume=.6;
  const tryPlay=()=>{const pr=bgm.play();if(pr&&pr.catch)pr.catch(()=>{document.addEventListener('click',()=>{if(on)bgm.play().catch(()=>{})},{once:true})})};
  bgm.addEventListener('error',async()=>{try{const r=await fetch('/_blob/827833c7ee7bf4b13c147a6a03ec985f');const b=await r.blob();bgm.src=URL.createObjectURL(new Blob([b],{type:'video/mp4'}));bgm.load();tryPlay()}catch(e){}},{once:true});
  tryPlay();
  
  mute.classList.add('show');
};
mute.onclick=()=>{
  on=!on;
  if(on){bgm.play().catch(()=>{});bgm.volume=.6;mute.style.opacity=1;mute.textContent='♪'}
  else{bgm.pause();mute.textContent='✕'}
};

$('env').onclick=async()=>{
  if(opened)return; opened=true;
  $('env').classList.add('open');
  $('hint').style.opacity=0;
  await sleep(2600);
  show('s3');
  await sleep(1000);
  typeLetter();
};

async function typeLetter(){
  const card=$('card');
  const caret=document.createElement('span');caret.className='caret';
  for(const para of letter){
    const p=document.createElement('p');
    card.appendChild(p);
    const words=para.split(' ');
    for(const word of words){
      const s=document.createElement('span');
      s.className='w';s.textContent=word+' ';
      p.appendChild(s);p.appendChild(caret);
      card.scrollTo({top:card.scrollHeight,behavior:'smooth'});
      let d=190;
      if(/[,;]$/.test(word))d+=170;
      if(/[.?!]$/.test(word))d+=380;
      await sleep(d);
    }
    await sleep(600);
  }
  caret.remove();
  done=true;
  $('s3').classList.add('ready');
  $('tap').classList.add('show');
}

$('s3').addEventListener('click',()=>{
  if(!done)return;
  done=false;
  show('s4');
  const emojis=['❤️','💕','💗','💖','💞'];
  const spawn=()=>{
    const h=document.createElement('span');
    h.className='heart';
    h.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    h.style.left=Math.random()*94+'vw';
    h.style.fontSize=(18+Math.random()*24)+'px';
    h.style.animationDuration=(5+Math.random()*4)+'s';
    document.body.appendChild(h);
    h.addEventListener('animationend',()=>h.remove());
  };
  for(let i=0;i<10;i++)setTimeout(spawn,i*150);
  setInterval(spawn,450);
});
</script>
</body>
</html>
